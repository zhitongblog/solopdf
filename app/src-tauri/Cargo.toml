[package]
name = "solopdf"
version = "0.7.1"
description = "SoloPDF — free, ad-free, local-first PDF reader with highlights-as-Markdown"
authors = ["alexlee"]
edition = "2021"
autobins = false
# three [[bin]]s (app + two CLI drivers): tauri needs to know which is the app
default-run = "SoloPDF"

# Match tauri.conf.json mainBinaryName exactly — SoloMD shipped a Windows
# NSIS shortcut pointing at the wrong casing once; not repeating that.
[[bin]]
name = "SoloPDF"
path = "src/main.rs"

# OCR CLI driver — shipped artifact (see README); desktop only
[[bin]]
name = "solopdf-ocr"
path = "src/bin/ocr_cli.rs"

# Document-operations CLI driver — shipped artifact (see README)
[[bin]]
name = "solopdf-doc"
path = "src/bin/doc_cli.rs"

[lib]
name = "solopdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# enables the PP-OCR ONNX engine on macOS too, so the Windows/Linux OCR
# pipeline can be developed and tested on this machine before UTM runs
ppocr = ["dep:ort"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
twox-hash = "2"
lopdf = "0.36"
# image: all platforms — the deskew preprocessor runs before either engine
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ort = { version = "2.0.0-rc.10", optional = true, features = ["download-binaries"] }
djvu-rs = { version = "0.30.1", default-features = false, features = ["std"] }

# Translation provider (opt-in, user-configured DeepL / OpenAI-compatible
# endpoint): one HTTPS POST through the OS TLS stack. Android is left out —
# its native-tls would need a cross-compiled OpenSSL; the WebView fetch
# covers it (see app/src/translate.ts).
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls"] }

# PP-OCR is the shipped engine on Windows/Linux
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }

# Android: content:// URIs are not paths, so the ContentResolver has to be
# called over JNI (see src/android.rs). Kept out of the generated Kotlin
# project on purpose — gen/ is gitignored and would need re-patching.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# tao is already in the tree under tauri-runtime-wry and it is what stores the
# live JavaVM + Activity for the running app. Declaring the same semver makes
# cargo unify it, so we read the very statics Tauri populated.
tao = "0.35"

# desktop-only: single-instance forwarding
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# SOLOPDF_DEBUG bridge — on every platform now. iOS simulators share
# localhost with the host; Android reaches it through `adb forward`. Without
# it there is no way to drive the real mobile app headlessly.
[dependencies.tiny_http]
version = "0.12"

# Debug builds run the same lopdf/flate/image code the release build does,
# and un-optimised miniz turns a one-second page operation into a minute.
# Optimise dependencies only — our own crate stays debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
