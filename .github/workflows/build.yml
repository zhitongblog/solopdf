name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The ARM legs match the UTM VMs on the maintainer's Apple Silicon
          # machine, which is where hands-on testing happens. The x64 legs are
          # CI-only — they cover the architecture most users actually run.
          - os: macos-14            # one universal dmg: arm64 + x86_64
            target: mac-universal
          - os: windows-11-arm      # matches UTM Win11-ARM VM
            target: win-aarch64
          - os: windows-latest
            target: win-x64
          - os: ubuntu-24.04-arm    # matches UTM Ubuntu-ARM VM
            target: linux-aarch64
          - os: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}

      - name: Extra Rust targets (macOS universal)
        if: matrix.target == 'mac-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system deps (webkit2gtk)
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev xdg-utils file

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solopdf/core build
      - run: pnpm --filter @solopdf/core test
      - run: node scripts/check-i18n.mjs
      - name: Rust tests (pdfops / djvu)
        run: cargo test --lib --manifest-path app/src-tauri/Cargo.toml

      - name: Build Tauri app
        if: matrix.target != 'mac-universal'
        run: pnpm --filter solopdf-app tauri build
        env:
          CI: true

      # macOS goes through the release script so CI exercises the exact path
      # that produces the shipped dmg (helper lipo included). Unsigned here —
      # no Developer ID cert on the runner; the released dmg is built and
      # notarized locally.
      - name: Build universal dmg
        if: matrix.target == 'mac-universal'
        run: ./scripts/build-dmg.sh
        env:
          CI: true

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.target }}" in
            mac-universal)
              cp app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/ ;;
            win-*)
              cp app/src-tauri/target/release/bundle/nsis/*.exe out/ 2>/dev/null || true
              cp app/src-tauri/target/release/bundle/msi/*.msi out/ 2>/dev/null || true ;;
            linux-*)
              cp app/src-tauri/target/release/bundle/deb/*.deb out/ 2>/dev/null || true
              cp app/src-tauri/target/release/bundle/appimage/*.AppImage out/ 2>/dev/null || true ;;
          esac
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: solopdf-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  # Android is its own job: it needs the SDK/NDK and cross-compiles four ABIs,
  # so folding it into the desktop matrix would slow every platform down.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125" "platforms;android-34"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: android

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solopdf/core build

      - name: Build APK + AAB
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          # Release signing needs a keystore the maintainer owns; without one
          # this produces an UNSIGNED release build, which is still useful for
          # sideloading and for catching build breakage.
          ANDROID_KEY_PATH: ${{ secrets.ANDROID_KEY_PATH }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cd app && pnpm tauri android init
          cd ..
          # the manifest patch (open-with + deep link) lives in the script
          bash scripts/build-android.sh release || bash scripts/build-android.sh

      - name: Collect artifacts
        run: |
          mkdir -p out
          find app/src-tauri/gen/android/app/build/outputs \
            \( -name "*.apk" -o -name "*.aab" \) -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: solopdf-android
          path: out/*
          if-no-files-found: error
